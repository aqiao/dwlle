apiVersion: apps/v1
kind: Deployment
metadata:
  name: dolphinscheduler
  namespace: dwlle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dolphinscheduler
  template:
    metadata:
      labels:
        app: dolphinscheduler
      annotations:
        dwlle/config-sha256: "__DS_CONFIG_SHA256__"
        dwlle/rds-secret-sha256: "__RDS_SECRET_SHA256__"
    spec:
      initContainers:
        - name: schema-init
          image: __REPOSITORY_URI__@__DS_IMAGE_DIGEST__
          command: ["/bin/bash", "/opt/dolphinscheduler/tools/bin/upgrade-schema.sh"]
          env:
            - name: RDS_HOST
              valueFrom:
                secretKeyRef:
                  name: rds-dwlle
                  key: host
            - name: DATABASE
              value: postgresql
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://$(RDS_HOST):5432/dolphinscheduler
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rds-dwlle
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-dwlle
                  key: password
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: org.hibernate.dialect.PostgreSQLDialect
      containers:
        - name: dolphinscheduler
          image: __REPOSITORY_URI__@__DS_IMAGE_DIGEST__
          ports:
            - containerPort: 12345
          env:
            - name: RDS_HOST
              valueFrom:
                secretKeyRef:
                  name: rds-dwlle
                  key: host
            - name: DATABASE
              value: postgresql
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://$(RDS_HOST):5432/dolphinscheduler
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rds-dwlle
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-dwlle
                  key: password
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: org.hibernate.dialect.PostgreSQLDialect
            - name: JAVA_OPTS
              value: -server -Xms1g -Xmx1g -XX:+IgnoreUnrecognizedVMOptions
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: "2"
              memory: 2560Mi
          readinessProbe:
            httpGet:
              path: /dolphinscheduler/ui/
              port: 12345
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /dolphinscheduler/ui/
              port: 12345
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dolphinscheduler
  namespace: dwlle
spec:
  selector:
    app: dolphinscheduler
  ports:
    - port: 12345
      targetPort: 12345
