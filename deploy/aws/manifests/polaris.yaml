apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-config
  namespace: dwlle
data:
  application.properties: |
    polaris.realm-context.realms=POLARIS
    quarkus.otel.sdk.disabled=true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: dwlle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polaris
  template:
    metadata:
      labels:
        app: polaris
    spec:
      serviceAccountName: data-plane
      containers:
        - name: polaris
          image: __REPOSITORY_URI__:polaris-1.8.0
          ports:
            - containerPort: 8181
            - containerPort: 8182
          env:
            - name: AWS_REGION
              value: __REGION__
            - name: POLARIS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-auth
                  key: client-secret
            - name: POLARIS_BOOTSTRAP_CREDENTIALS
              value: POLARIS,root,$(POLARIS_CLIENT_SECRET)
          volumeMounts:
            - name: config
              mountPath: /deployments/config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /q/health
              port: 8182
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /q/health
              port: 8182
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 10
      volumes:
        - name: config
          configMap:
            name: polaris-config
---
apiVersion: v1
kind: Service
metadata:
  name: polaris
  namespace: dwlle
spec:
  selector:
    app: polaris
  ports:
    - port: 8181
      targetPort: 8181
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-setup-scripts
  namespace: dwlle
data:
  obtain-token.sh: |
    set -eu
    TOKEN=$(curl --fail-with-body -s http://polaris:8181/api/catalog/v1/oauth/tokens \
      --user "${CLIENT_ID}:${CLIENT_SECRET}" \
      -H "Polaris-Realm: POLARIS" \
      -d grant_type=client_credentials \
      -d scope=PRINCIPAL_ROLE:ALL | sed -n 's/.*"access_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
    if [ -z "${TOKEN}" ]; then
      echo "[dwlle] Failed to obtain Polaris token" >&2
      exit 1
    fi
    export TOKEN
  create-catalog.sh: |
    set -eu
    . /polaris/obtain-token.sh
    if curl --fail --silent -H "Authorization: Bearer ${TOKEN}" \
      -H "Polaris-Realm: POLARIS" \
      http://polaris:8181/api/management/v1/catalogs/quickstart_catalog >/dev/null; then
      echo "[dwlle] Catalog already exists"
      exit 0
    fi
    PAYLOAD='{"catalog":{"name":"quickstart_catalog","type":"INTERNAL","readOnly":false,"properties":{"default-base-location":"'${STORAGE_LOCATION}'"},"storageConfigInfo":{"storageType":"S3","roleArn":"__STORAGE_ROLE_ARN__","region":"'${AWS_REGION}'","kmsUnavailable":true}}}'
    curl --fail-with-body -s \
      -H "Authorization: Bearer ${TOKEN}" \
      -H "Polaris-Realm: POLARIS" \
      -H 'Content-Type: application/json' \
      http://polaris:8181/api/management/v1/catalogs \
      -d "$PAYLOAD"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-setup
  namespace: dwlle
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: __REPOSITORY_URI__:curl-8.23.0
          env:
            - name: CLIENT_ID
              value: root
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-auth
                  key: client-secret
            - name: AWS_REGION
              value: __REGION__
            - name: STORAGE_LOCATION
              value: s3://__DATA_BUCKET__/warehouse
          volumeMounts:
            - name: scripts
              mountPath: /polaris
          command:
            - /bin/sh
            - -c
            - >-
              . /polaris/create-catalog.sh &&
              curl --fail-with-body
              -H "Authorization: Bearer $TOKEN"
              -H 'Content-Type: application/json'
              -X PUT
              http://polaris:8181/api/management/v1/catalogs/quickstart_catalog/catalog-roles/catalog_admin/grants
              -d '{"type":"catalog", "privilege":"CATALOG_MANAGE_CONTENT"}' &&
              echo "[dwlle] Polaris catalog is ready"
      volumes:
        - name: scripts
          configMap:
            name: polaris-setup-scripts
            defaultMode: 0755
