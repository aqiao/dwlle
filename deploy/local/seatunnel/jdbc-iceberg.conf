env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    driver = org.postgresql.Driver
    url = ${LOCAL_POSTGRES_JDBC_URL}
    username = ${LOCAL_POSTGRES_USER}
    password = "${LOCAL_POSTGRES_PASSWORD:}"
    query = "SELECT 1 AS id, 'page_view' AS event_type, 101 AS user_id"
  }
}

transform {
}

sink {
  Iceberg {
    catalog_name = "quickstart_catalog"
    namespace = "demo"
    table = "events"
    data_save_mode = "DROP_DATA"

    iceberg.catalog.config = {
      type = "rest"
      warehouse = "quickstart_catalog"
      uri = "http://polaris:8181/api/catalog"
      rest.auth.type = "oauth2"
      credential = ${POLARIS_CREDENTIAL}
      oauth2-server-uri = "http://polaris:8181/api/catalog/v1/oauth/tokens"
      scope = "PRINCIPAL_ROLE:ALL"
      header.Polaris-Realm = "POLARIS"
      header.X-Iceberg-Access-Delegation = "vended-credentials"
      io-impl = "org.apache.iceberg.aws.s3.S3FileIO"
      s3.endpoint = "http://rustfs:9000"
      s3.path-style-access = "true"
      client.region = "us-west-2"
    }

    iceberg.table.write-props = {
      write.format.default = "parquet"
    }
  }
}
